server.port=8080

spring.application.name=pulse-backend

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://root:fratton2026@mongo:27017/pulse?authSource=admin}

spring.config.import=optional:classpath:application-secrets.properties

jwt.secret=${JWT_SECRET:change-me-in-local-dev-only-min-32-chars!!}
jwt.expiration-ms=86400000

openai.api-key=${OPENAI_API_KEY:}
openai.moderation.enabled=${OPENAI_MODERATION_ENABLED:true}
openai.moderation.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.moderation.model=${OPENAI_MODERATION_MODEL:omni-moderation-latest}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
