name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pulse-backend/**'
              - 'docker-compose.yml'
              - '.env.example'
            flutter:
              - 'pulse-flutter/**'
            shared:
              - '.github/workflows/**'

  backend:
    name: Backend — Compile, Test, Coverage, Architecture
    needs: changes
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: fratton2026
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: pulse-backend

    steps:
      - name: Skip backend checks
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.shared != 'true'
        run: echo "No backend changes in this commit."

      - name: Checkout
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/checkout@v4

      - name: Set up Java 21
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pulse-backend/pom.xml

      - name: Compile, test, and check coverage
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
        env:
          SPRING_DATA_MONGODB_URI: mongodb://root:fratton2026@localhost:27017/pulse?authSource=admin
        run: mvn -B verify

      - name: Upload Jacoco report
        if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: pulse-backend/target/site/jacoco
          if-no-files-found: ignore

  flutter:
    name: Flutter — Analyze and Test
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-flutter

    steps:
      - name: Skip flutter checks
        if: needs.changes.outputs.flutter != 'true' && needs.changes.outputs.shared != 'true'
        run: echo "No flutter changes in this commit."

      - name: Checkout
        if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/checkout@v4

      - name: Set up Flutter
        if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.shared == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.shared == 'true'
        run: flutter pub get

      - name: Analyze and test
        if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          flutter analyze
          flutter test

  ci-success:
    name: CI — Required
    needs: [changes, backend, flutter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          check_job() {
            local needed="$1"
            local result="$2"
            local name="$3"

            if [ "$needed" != "true" ]; then
              echo "$name skipped (no relevant file changes)"
              return 0
            fi

            if [ "$result" != "success" ]; then
              echo "$name failed or was cancelled (result=$result)"
              exit 1
            fi

            echo "$name passed"
          }

          check_job "${{ needs.changes.outputs.backend }}" "${{ needs.backend.result }}" "Backend"
          check_job "${{ needs.changes.outputs.flutter }}" "${{ needs.flutter.result }}" "Flutter"
