name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pulse-backend/**'
              - 'docker-compose.yml'
              - '.env.example'
            flutter:
              - 'pulse-flutter/**'
          shared:
            - '.github/workflows/**'

  backend:
    name: Backend — Compile, Test, Coverage, Architecture
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pulse-backend/pom.xml

      - name: Restore Maven repository cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pulse-backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile
        run: mvn -B clean compile

      - name: Test with Jacoco coverage gate
        run: mvn -B clean test

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: pulse-backend/target/site/jacoco
          if-no-files-found: ignore

  flutter:
    name: Flutter — Analyze and Test
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  ci-success:
    name: CI — Required
    needs: [changes, backend, flutter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          check_job() {
            local needed="$1"
            local result="$2"
            local name="$3"

            if [ "$needed" != "true" ]; then
              echo "$name skipped (no relevant file changes)"
              return 0
            fi

            if [ "$result" != "success" ]; then
              echo "$name failed or was cancelled (result=$result)"
              exit 1
            fi

            echo "$name passed"
          }

          check_job "${{ needs.changes.outputs.backend }}" "${{ needs.backend.result }}" "Backend"
          check_job "${{ needs.changes.outputs.flutter }}" "${{ needs.flutter.result }}" "Flutter"
